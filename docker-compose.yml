services:
  db:
    image: mysql:8.0
    container_name: employeehub_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-employeehub_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_pass123}
      MYSQL_USER: ${DB_USER:-employee_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-employee_pass123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - employeehub_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employeehub_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      - ./employeehub:/app/employeehub
    depends_on:
      db:
        condition: service_healthy
    networks:
      - employeehub_net

volumes:
  mysql_data:
    name: employeehub_mysql_data

networks:
  employeehub_net:
    name: employeehub_network
    driver: bridge

